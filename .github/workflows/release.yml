name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      # La release ne doit jamais sortir de code casse -- meme garde que la CI, avant de
      # passer du temps a compiler l'exe/l'installeur.
      - name: Compile check + tests
        run: |
          python -m compileall osintbox osintbox_app.py -q
          python -m pytest tests/ -v

      - name: Build x64 executable
        run: .\build_exe.bat

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Appel direct de ISCC (plutot que via un script d'install) : la version vient du tag
      # git, pas d'un timestamp de build local, et pas de tentative de signature (differee,
      # voir memoire "scan_system: signature de code differee" -- meme choix ici) qui
      # echouerait sans certificat sur le runner.
      - name: Build installer
        id: build_installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc /DMyAppVersion="$version" "installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versioned = "installer_output\OSINTBoxSetup-$version.exe"
          $legacy = "installer_output\OSINTBoxSetup.exe"
          if (Test-Path -LiteralPath $versioned) {
            $installer = (Resolve-Path -LiteralPath $versioned).Path
          } elseif (Test-Path -LiteralPath $legacy) {
            $installer = (Resolve-Path -LiteralPath $legacy).Path
          } else {
            throw "OSINTBox installer not found after compilation"
          }
          "path=$installer" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\OSINTBox.exe" `
            "${{ steps.build_installer.outputs.path }}" `
            --title "OSINTBox ${{ github.ref_name }}" `
            --generate-notes
